[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]
# Script triển khai ghi deployments/local.json ở thư mục gốc repo
fs_permissions = [{ access = "read-write", path = "../deployments" }, { access = "read", path = "../shared" }]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 100
fail_on_revert = false
